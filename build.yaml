# Core-dump diagnostic build for the Charybdis Mini right/central half.
# Uses the larger nice!nano debug partition so the full Charybdis firmware
# plus Zephyr coredump support fit while preserving a flash coredump region.

board:
  - nice_nano//zmk_debug_extra

include:
  - name: coredump-debug
    board: nice_nano//zmk_debug_extra
    shield:
      - charybdis_right_bt
    keymap:
      - charybdis
