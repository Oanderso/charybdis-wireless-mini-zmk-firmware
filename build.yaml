# Build the Charybdis Mini Bluetooth left and right halves
# using the single Keymap Editor-managed keymap:
# config/charybdis.keymap

board:
  - nice_nano//zmk

include:
  - name: bt
    board: nice_nano//zmk
    shield:
      - charybdis_left_bt
      - charybdis_right_bt
    keymap:
      - charybdis
